<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Diego Andres Granados</title>
    <meta name="description" content="Product review form for Diego Granados, web developer.">
    <meta name="author" content="Diego Andres Granados">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <span id="course-title">WDD 131: Dynamic Web Fundamentals - <span id="student-name">Diego Andres Granados</span></span>
        <nav>
            <a href="index.html">Home</a>
            <a href="place.html">Place</a>
            <a href="form.html">Form</a>
        </nav>
    </header>

    <main>
        <h1>Product Review Form</h1>
        <section class="form-section">
            <h2>Share Your Experience</h2>
            <p>Please fill out the form below to submit your product review.</p>
            
            <form id="reviewForm" method="get" action="review.html">
                <fieldset>
                    <legend>Product Information</legend>
                    
                    <div class="form-group">
                        <label for="productName">Product Name <span class="required">*</span></label>
                        <select id="productName" name="productName" required>
                            <option value="" disabled selected>Select a Product ...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="installationDate">Date of Installation <span class="required">*</span></label>
                        <input 
                            type="date" 
                            id="installationDate" 
                            name="installationDate" 
                            required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Rating</legend>
                    
                    <div class="form-group">
                        <label>Overall Rating <span class="required">*</span></label>
                        <div class="rating-group">
                            <label class="rating-label">
                                <input 
                                    type="radio" 
                                    id="rating1" 
                                    name="rating" 
                                    value="1" 
                                    required>
                                <span class="star">☆</span> 1
                            </label>
                            <label class="rating-label">
                                <input 
                                    type="radio" 
                                    id="rating2" 
                                    name="rating" 
                                    value="2" 
                                    required>
                                <span class="star">☆☆</span> 2
                            </label>
                            <label class="rating-label">
                                <input 
                                    type="radio" 
                                    id="rating3" 
                                    name="rating" 
                                    value="3" 
                                    required>
                                <span class="star">☆☆☆</span> 3
                            </label>
                            <label class="rating-label">
                                <input 
                                    type="radio" 
                                    id="rating4" 
                                    name="rating" 
                                    value="4" 
                                    required>
                                <span class="star">☆☆☆☆</span> 4
                            </label>
                            <label class="rating-label">
                                <input 
                                    type="radio" 
                                    id="rating5" 
                                    name="rating" 
                                    value="5" 
                                    required>
                                <span class="star">☆☆☆☆☆</span> 5
                            </label>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Features</legend>
                    
                    <div class="form-group">
                        <label>Useful Features</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature1" 
                                    name="features" 
                                    value="Easy to Install">
                                Easy to Install
                            </label>
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature2" 
                                    name="features" 
                                    value="User Friendly">
                                User Friendly
                            </label>
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature3" 
                                    name="features" 
                                    value="Good Documentation">
                                Good Documentation
                            </label>
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature4" 
                                    name="features" 
                                    value="Reliable">
                                Reliable
                            </label>
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature5" 
                                    name="features" 
                                    value="Good Value">
                                Good Value
                            </label>
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="feature6" 
                                    name="features" 
                                    value="Fast Performance">
                                Fast Performance
                            </label>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Review Details</legend>
                    
                    <div class="form-group">
                        <label for="writtenReview">Written Review</label>
                        <textarea 
                            id="writtenReview" 
                            name="writtenReview" 
                            rows="6" 
                            placeholder="Share your thoughts about the product..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="userName">User Name</label>
                        <input 
                            type="text" 
                            id="userName" 
                            name="userName" 
                            autocomplete="name"
                            placeholder="Your name (optional)">
                    </div>
                </fieldset>

                <div class="form-actions">
                    <input type="submit" value="Submit Review" class="submit-btn">
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Diego Andres Granados 🌸 Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
